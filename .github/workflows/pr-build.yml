name: Build & Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build fetch helper
      run: dotnet build tools/wv2_fetch_helper/wv2_fetch_helper.csproj --configuration Release

    - name: Build
      run: dotnet build --configuration Release /p:DevPluginDir="${{ runner.temp }}\devPlugins"

    - name: Test
      run: dotnet test FFXIV_Penumbra_Mod_Chinese_Localization_Plugin.Tests/FFXIV_Penumbra_Mod_Chinese_Localization_Plugin.Tests.csproj --configuration Release --no-build --verbosity normal
